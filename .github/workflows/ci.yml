name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    env:
      CC: gcc-14
      CXX: g++-14

    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake ninja-build clang-format gcc-14 g++-14 openssl libssl-dev

    - name: Configure
      run: cmake --preset ${{ matrix.preset }}

    - name: Check formatting
      run: cmake --build --preset ${{ matrix.preset }} --target format-check

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} --parallel

    - name: Run tests
      run: ctest --preset ${{ matrix.preset }}
